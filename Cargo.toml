[package]
name = "main-menu-randomizer"
version = "2.0.4"
edition = "2021"

[features]
ae = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "replacer"
path = "src/bin/bin.rs"

[[bench]]
name = "hash"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono={version="0.4"}
toml = "0.5"
regex = "1.5"
thiserror = "1.0"
rand = "0.8"
walkdir = "2.3"
bitflags = "2.4"
crc32fast = "1.4.0"
serde_json = "1.0.114"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }

